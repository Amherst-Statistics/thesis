title: Amherst Thesis Format Template
author: Brittney Bailey
version: 3.0.0
contributes:
  formats:
    pdf:
      pdf-engine: pdflatex
      documentclass: report
      # Uncomment the line below if you want book-binding margins
      # classoption: twoside
      geometry:
      # Set inner=1.5in below if you want book-binding margins
      - inner=1in
      - outer=1in
      - top=1in
      - bottom=1in
      - heightrounded
      indent: true
      number-sections: true
      number-depth: 2
      toc: false
      lof: false
      lot: false
      # toc-depth: 2
      # Font options
      block-headings: false
      colorlinks: true
      fontsize: 11pt
      linestretch: 2
      # Customizing Quarto LaTeX template:
      # OG: https://github.com/quarto-dev/quarto-cli/blob/main/src/resources/formats/pdf/pandoc/template.tex
      # How to: https://quarto.org/docs/journals/templates.html#latex-partials
      # Original partials: https://github.com/quarto-dev/quarto-cli/tree/main/src/resources/formats/pdf/pandoc
      template-partials:
        - "before-title.tex"
        - "title.tex"
      # Figure dimension defaults
      fig-height: 2.4 
      fig-width:  3.6
      # Code chunk option defaults
      execute:
          echo: false
          warning: false
          message: false
      # Comment the line below to remove the code line numbers
      code-line-numbers: true
      # Uncomment the line below if you want a code block border
      # code-block-border-left: "#cec4e3"
      highlight-style: arrow

